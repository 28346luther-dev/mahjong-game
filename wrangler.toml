name = "mahjong-game"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "MahjongRoom" },
  { name = "AUTH", class_name = "AuthStore" },
  { name = "CLUB", class_name = "ClubSocial" },
  { name = "POKER", class_name = "PokerTable" },
  { name = "KART", class_name = "KartLeaderboard" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MahjongRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClubSocial"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["PokerTable"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["KartLeaderboard"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Keep production account-service exceptions visible in Workers Logs.
[observability.logs]
enabled = true
invocation_logs = true
