name = "mahjong-game"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "MahjongRoom" },
  { name = "AUTH", class_name = "AuthStore" },
  { name = "CLUB", class_name = "ClubSocial" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MahjongRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ClubSocial"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
