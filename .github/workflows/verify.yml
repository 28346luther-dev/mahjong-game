name: Verify Mahjong game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check src/worker.js
      - run: node --check src/auth.js
      - run: node --check public/app.js
      - run: node --check public/account.js
      - run: node --check public/clubhouse.js
